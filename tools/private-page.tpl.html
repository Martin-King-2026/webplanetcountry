<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Служебные камеры</title>
<style>
:root{--bg:#F3F5F9;--sf:#fff;--sf2:#EAEEF6;--tx:#121826;--mu:#5A6375;--bd:#DDE2EC;--pr:#4353FF;--pr-tx:#fff;--r:14px;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0B0F18;--sf:#151B27;--sf2:#1C2433;--tx:#E6E9F2;--mu:#98A0B3;--bd:#263045;--pr:#8C98FF;--pr-tx:#0B0F18;color-scheme:dark}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:1180px;margin:0 auto;padding:16px}
h1{font-size:1.5rem;margin:4px 0 2px}.lead{color:var(--mu);margin:0 0 14px}
.player{position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 0 12px}
.stage{position:relative;aspect-ratio:16/9;max-height:62vh;background:#000;border-radius:var(--r);overflow:hidden;display:none}
.stage.on{display:block}.stage iframe,.stage video,.stage img{position:absolute;inset:0;width:100%;height:100%;border:0;object-fit:contain;background:#000}
.now{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:8px}.now b{margin-right:6px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border:1px solid var(--bd);border-radius:999px;background:var(--sf);color:var(--tx);font:inherit;font-size:.9rem;cursor:pointer;text-decoration:none}
.btn:hover{border-color:var(--pr);color:var(--pr)}.btn.on{background:var(--pr);border-color:var(--pr);color:var(--pr-tx)}
.btn small{opacity:.75}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 14px}
.tools input{flex:1 1 260px;padding:9px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--sf);color:var(--tx);font:inherit}
.city{margin:0 0 16px}.city h2{font-size:1rem;margin:0 0 6px;color:var(--mu);font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px}
.cam{display:flex;flex-direction:column;gap:2px;padding:10px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--sf);cursor:pointer;text-align:left;color:inherit;font:inherit}
.cam:hover{border-color:var(--pr)}.cam.on{border-color:var(--pr);box-shadow:0 0 0 2px var(--pr) inset}
.cam small{color:var(--mu);font-size:.82rem}
.empty{color:var(--mu)}
</style></head><body>
<div class="wrap">
<h1>Служебные камеры</h1>
<p class="lead">Видны только на этом компьютере. Кухни, ЖК и стройки, мойки, парикмахерские и другие нетуристические камеры. Обновлено: @@DATE@@.</p>
<div class="player"><div class="stage" id="stage"></div><div class="now" id="now"></div></div>
<div class="tools"><input id="q" type="search" placeholder="Название, город или страна"><span id="kinds"></span></div>
<div id="list"></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.13/dist/hls.min.js"></script>
<script>
var CAMS = /*@@DATA@@*/[];
var KINDS = { '': 'Все', view: 'Общие виды', street: 'Улицы', indoor: 'Помещения' };
var kind = '', cur = null, hls = null;
var $ = function (s) { return document.querySelector(s); };
function el(tag, attrs, kids) {
  var e = document.createElement(tag);
  Object.keys(attrs || {}).forEach(function (k) { if (k.slice(0, 2) === 'on') e.addEventListener(k.slice(2), attrs[k]); else if (k === 'text') e.textContent = attrs[k]; else e.setAttribute(k, attrs[k]); });
  (kids || []).forEach(function (c) { if (c != null) e.append(c); });
  return e;
}
function norm(s) { return String(s || '').toLowerCase().replace(/ё/g, 'е'); }
function srcLabel(s) {
  var by = s.by ? ' · ' + s.by : '';
  return { yt: 'YouTube', ytc: 'Эфир канала', hls: 'Поток', iframe: 'Плеер', img: 'Фото', link: 'На сайте' }[s.type] + by;
}
function play(cam, i) {
  var s = cam.sources[i], stage = $('#stage');
  if (hls) { hls.destroy(); hls = null; }
  stage.innerHTML = '';
  stage.className = 'stage on';
  if (s.type === 'link') { window.open(s.src, '_blank', 'noopener'); stage.className = 'stage'; }
  else if (s.type === 'yt' || s.type === 'ytc') {
    stage.append(el('iframe', { src: s.type === 'yt' ? 'https://www.youtube-nocookie.com/embed/' + s.id + '?autoplay=1&mute=1'
      : 'https://www.youtube.com/embed/live_stream?channel=' + s.id + '&autoplay=1&mute=1', allow: 'autoplay; fullscreen', allowfullscreen: '' }));
  } else if (s.type === 'hls') {
    var v = el('video', { controls: '', autoplay: '', playsinline: '' }); v.muted = true; stage.append(v);
    if (window.Hls && Hls.isSupported()) { hls = new Hls(); hls.loadSource(s.src); hls.attachMedia(v); } else v.src = s.src;
  } else if (s.type === 'img') {
    var img = el('img', { src: s.src, alt: '' }); stage.append(img);
    var t = setInterval(function () { if (!img.isConnected) return clearInterval(t); img.src = s.src.split('#')[0] + (s.src.indexOf('?') < 0 ? '?' : '&') + '_=' + Date.now(); }, (s.refresh || 60) * 1000);
  } else stage.append(el('iframe', { src: s.src, allow: 'autoplay; fullscreen', allowfullscreen: '' }));
  var now = $('#now'); now.innerHTML = '';
  now.append(el('b', { text: cam.ru + ' — ' + cam.city }));
  cam.sources.forEach(function (x, j) { now.append(el('button', { class: 'btn' + (j === i ? ' on' : ''), type: 'button', onclick: function () { play(cam, j); }, text: srcLabel(x) })); });
  if (s.type === 'yt') now.append(el('a', { class: 'btn', href: 'https://www.youtube.com/watch?v=' + s.id, target: '_blank', rel: 'noopener', text: 'Открыть на YouTube ↗' }));
  cur = cam;
  document.querySelectorAll('.cam').forEach(function (b) { b.classList.toggle('on', b._cam === cam); });
}
function draw() {
  var q = norm($('#q').value.trim());
  var hits = CAMS.filter(function (c) { return (!kind || c.kind === kind) && (!q || norm(c.ru + ' ' + c.en + ' ' + c.city + ' ' + c.country).indexOf(q) >= 0); });
  var n = { '': CAMS.length }; CAMS.forEach(function (c) { n[c.kind] = (n[c.kind] || 0) + 1; });
  var kb = $('#kinds'); kb.innerHTML = '';
  Object.keys(KINDS).forEach(function (k) { if (k && !n[k]) return; kb.append(el('button', { class: 'btn' + (k === kind ? ' on' : ''), type: 'button', onclick: function () { kind = k; draw(); } }, [KINDS[k] + ' ', el('small', { text: String(n[k]) })])); });
  var list = $('#list'); list.innerHTML = '';
  if (!hits.length) { list.append(el('p', { class: 'empty', text: 'Ничего не найдено.' })); return; }
  var by = {};
  hits.forEach(function (c) { var k = c.city + ', ' + c.country; (by[k] = by[k] || []).push(c); });
  Object.keys(by).sort(function (a, b) { return a.localeCompare(b, 'ru'); }).forEach(function (k) {
    var grid = el('div', { class: 'grid' });
    by[k].sort(function (a, b) { return a.ru.localeCompare(b.ru, 'ru'); }).forEach(function (c) {
      var b = el('button', { class: 'cam' + (c === cur ? ' on' : ''), type: 'button', onclick: function () { play(c, 0); window.scrollTo({ top: 0, behavior: 'smooth' }); } },
        [el('span', { text: c.ru }), el('small', { text: KINDS[c.kind] + ' · ' + c.sources.length + ' тр.' })]);
      b._cam = c; grid.append(b);
    });
    list.append(el('section', { class: 'city' }, [el('h2', { text: k + ' (' + by[k].length + ')' }), grid]));
  });
}
$('#q').addEventListener('input', draw);
draw();
</script></body></html>
